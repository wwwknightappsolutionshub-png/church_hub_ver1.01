apiVersion: apps/v1
kind: Deployment
metadata:
  name: churchhub-api
  labels:
    app: churchhub-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churchhub-api
  template:
    metadata:
      labels:
        app: churchhub-api
    spec:
      containers:
        - name: api
          image: churchhub-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: churchhub-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: churchhub-api
spec:
  selector:
    app: churchhub-api
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
