# aaPanel / single-subdomain overlay — use with base + prod compose files.
# Example: church-hub.wazconnect.com (Nginx proxies / → web, /api → API)
#
# docker compose -f docker-compose.yml -f infra/docker/docker-compose.prod.yml \
#   -f infra/docker/docker-compose.aapanel.yml --env-file .env up -d

services:
  api:
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://churchhub:churchhub@postgres:5432/churchhub?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      CACHE_ENABLED: "true"
      API_PORT: "4000"
      API_URL: ${API_URL}
      API_PUBLIC_URL: ${API_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: churchhub-uploads
      S3_ACCESS_KEY: churchhub
      S3_SECRET_KEY: churchhub-secret
      S3_REGION: us-east-1
      S3_PUBLIC_URL: http://minio:9000/churchhub-uploads
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./uploads-data:/app/uploads

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    ports:
      - "127.0.0.1:3001:3000"

  # Postgres/Redis: no host ports — API reaches them on the Docker network.
  # (aaPanel often already uses 5432/6379 on the host.)
