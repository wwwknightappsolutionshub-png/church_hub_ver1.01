# Production overlay — use with base docker-compose.yml
# docker compose -f docker-compose.yml -f infra/docker/docker-compose.prod.yml up -d

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    image: churchhub-api:prod
    restart: unless-stopped
    # Host ports: set in docker-compose.aapanel.yml (127.0.0.1:4000)
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://churchhub:churchhub@postgres:5432/churchhub?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      API_PORT: '4000'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      DEVOTIONAL_AI_RATE_LIMIT: ${DEVOTIONAL_AI_RATE_LIMIT:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    image: churchhub-web:prod
    restart: unless-stopped
    # Host ports: set in docker-compose.aapanel.yml (127.0.0.1:3003)
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      # SSR fetches from the web container (e.g. /c/{slug} public pages)
      SERVER_API_URL: ${SERVER_API_URL:-http://api:4000}
    depends_on:
      - api
